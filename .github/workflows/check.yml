name: Guide checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python src/build.py
      - run: python tests/check_project.py
      - run: node tests/navigation.cjs
      - run: git diff --exit-code -- docs/index.html docs/manual.txt
